<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    body{
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:linear-gradient(135deg,#667eea,#764ba2);
    }

    .calculator{
        background:white;
        padding:30px;
        border-radius:15px;
        box-shadow:0 10px 25px rgba(0,0,0,0.2);
        width:350px;
    }

    h2{
        text-align:center;
        margin-bottom:20px;
        color:#333;
    }

    .input-group{
        margin-bottom:15px;
    }

    label{
        display:block;
        margin-bottom:5px;
        font-weight:bold;
        color:#444;
    }

    input{
        width:100%;
        padding:10px;
        border:1px solid #ccc;
        border-radius:8px;
        font-size:16px;
    }

    .buttons{
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:10px;
        margin-top:20px;
    }

    button{
        padding:12px;
        border:none;
        border-radius:8px;
        background:#667eea;
        color:white;
        font-size:16px;
        cursor:pointer;
        transition:0.3s;
    }

    button:hover{
        background:#5563d6;
        transform:scale(1.03);
    }

    .result{
        margin-top:20px;
    }
</style>
</head>

<body>

<div class="calculator">
    <h2>Simple Calculator</h2>

    <div class="input-group">
        <label>First Number</label>
        <input type="number" id="firstID">
    </div>

    <div class="input-group">
        <label>Second Number</label>
        <input type="number" id="secondID">
    </div>

    <div class="buttons">
        <button id="button1">+</button>
        <button id="button2">−</button>
        <button id="button3">÷</button>
        <button id="button4">×</button>
    </div>

    <div class="result">
        <label>Result</label>
        <input type="text" id="resultID" readonly>
    </div>
</div>

<script>

function getValues() {
    let first = parseFloat(document.getElementById("firstID").value) || 0;
    let second = parseFloat(document.getElementById("secondID").value) || 0;

    return { first, second };
}

document.getElementById("button1").addEventListener("click", () => {
    let { first, second } = getValues();
    document.getElementById("resultID").value = first + second;
});

document.getElementById("button2").addEventListener("click", () => {
    let { first, second } = getValues();
    document.getElementById("resultID").value = first - second;
});

document.getElementById("button3").addEventListener("click", () => {
    let { first, second } = getValues();

    if(second === 0){
        document.getElementById("resultID").value = "Cannot divide by 0";
        return;
    }

    document.getElementById("resultID").value = first / second;
});

document.getElementById("button4").addEventListener("click", () => {
    let { first, second } = getValues();
    document.getElementById("resultID").value = first * second;
});

</script>

</body>
</html>
