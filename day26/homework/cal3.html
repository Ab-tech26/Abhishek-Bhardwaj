<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Futuristic Calculator</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#050816;
    overflow:hidden;
}

/* Background Glow */
body::before,
body::after{
    content:'';
    position:absolute;
    width:400px;
    height:400px;
    border-radius:50%;
    filter:blur(140px);
}

body::before{
    background:#00ffff;
    top:-100px;
    left:-100px;
}

body::after{
    background:#ff00ff;
    bottom:-100px;
    right:-100px;
}

/* Main Container */
.calculator{
    width:850px;
    min-height:500px;
    display:flex;
    gap:20px;
    padding:25px;
    border-radius:30px;
    position:relative;
    overflow:hidden;
}

/* Animated Border */
.calculator::before{
    content:'';
    position:absolute;
    inset:0;
    background:linear-gradient(
        45deg,
        #00ffff,
        #ff00ff,
        #00ff88,
        #00ffff
    );
    background-size:400%;
    animation:borderMove 8s linear infinite;
}

.calculator::after{
    content:'';
    position:absolute;
    inset:3px;
    background:rgba(7,11,25,.95);
    border-radius:28px;
}

@keyframes borderMove{
    0%{background-position:0 0;}
    100%{background-position:400% 0;}
}

.left,
.right{
    position:relative;
    z-index:2;
}

/* History Panel */
.left{
    width:250px;
    padding:20px;
    border-radius:20px;
    background:rgba(255,255,255,.05);
    backdrop-filter:blur(15px);
}

.left h2{
    color:white;
    margin-bottom:15px;
}

.history{
    height:350px;
    overflow-y:auto;
    color:#00ff88;
}

.history div{
    margin-bottom:10px;
    padding:10px;
    border-radius:10px;
    background:rgba(255,255,255,.05);
}

/* Calculator Area */
.right{
    flex:1;
}

.title{
    text-align:center;
    color:white;
    font-size:32px;
    margin-bottom:20px;
    letter-spacing:3px;
}

.display{
    width:100%;
    padding:20px;
    margin-bottom:20px;
    border:none;
    border-radius:20px;
    background:black;
    color:#00ff88;
    font-size:38px;
    text-align:right;
    outline:none;

    text-shadow:
    0 0 10px #00ff88,
    0 0 20px #00ff88,
    0 0 40px #00ff88;
}

.inputs{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.inputs input{
    padding:15px;
    border:none;
    border-radius:15px;
    background:rgba(255,255,255,.08);
    color:white;
    font-size:18px;
    outline:none;
}

.buttons{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:15px;
    margin-top:20px;
}

button{
    padding:18px;
    border:none;
    border-radius:15px;
    cursor:pointer;
    font-size:22px;
    font-weight:bold;
    color:white;

    background:linear-gradient(
        135deg,
        #00c6ff,
        #0072ff
    );

    transition:.3s;
}

button:hover{
    transform:translateY(-5px) scale(1.05);

    box-shadow:
    0 0 15px #00c6ff,
    0 0 35px #00c6ff;
}

.clear{
    background:linear-gradient(
        135deg,
        #ff416c,
        #ff4b2b
    );
}

.clear:hover{
    box-shadow:
    0 0 15px #ff416c,
    0 0 35px #ff416c;
}

.footer{
    color:#777;
    text-align:center;
    margin-top:20px;
    font-size:14px;
}

</style>
</head>
<body>

<div class="calculator">

    <div class="left">
        <h2>📜 History</h2>
        <div class="history" id="history"></div>
    </div>

    <div class="right">

        <div class="title">⚡ Calculator</div>

        <input
            type="text"
            class="display"
            id="result"
            readonly
            value="0"
        >

        <div class="inputs">
            <input type="number" id="num1" placeholder="First Number">
            <input type="number" id="num2" placeholder="Second Number">
        </div>

        <div class="buttons">
            <button onclick="calculate('+')">+</button>
            <button onclick="calculate('-')">−</button>
            <button onclick="calculate('*')">×</button>
            <button onclick="calculate('/')">÷</button>
            <button class="clear" onclick="clearAll()">C</button>
        </div>

        <div class="footer">
            Keyboard Supported → + - * / Enter
        </div>

    </div>

</div>

<script>

const result = document.getElementById("result");
const history = document.getElementById("history");

function addHistory(text){
    const item = document.createElement("div");
    item.textContent = text;
    history.prepend(item);
}

function calculate(op){

    let a = parseFloat(num1.value) || 0;
    let b = parseFloat(num2.value) || 0;

    let ans;

    switch(op){
        case '+':
            ans = a + b;
            break;

        case '-':
            ans = a - b;
            break;

        case '*':
            ans = a * b;
            break;

        case '/':
            ans = b === 0 ? "Invalid" : a / b;
            break;
    }

    result.value = ans;

    addHistory(`${a} ${op} ${b} = ${ans}`);
}

function clearAll(){
    num1.value = '';
    num2.value = '';
    result.value = 0;
}

/* Keyboard Support */

document.addEventListener("keydown",(e)=>{

    if(e.key === '+') calculate('+');
    if(e.key === '-') calculate('-');
    if(e.key === '*') calculate('*');
    if(e.key === '/') calculate('/');
    if(e.key === 'Enter') calculate('+');

});

</script>

</body>
</html>
