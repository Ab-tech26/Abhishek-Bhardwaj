<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let team1 = parseInt(prompt("Enter first team :"))
        let team2 = parseInt(prompt("Enter second team :"))




        if (team1 > team2) {
            document.write("team 1 winner" + team1)

        } else {
            document.write("team 2 wins" + team2)
            
        }



    </script>

</body>
