<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function addition(){
            let num1 = parseInt(document.getElementById("first_number").value)
            let num2 = parseInt(document.getElementById("second_number").value)
            let result = num1 + num2;
            document.getElementById('result_id').value = result;

        }
             function substraction(){
            let num1 = parseInt(document.getElementById("first_number").value)
            let num2 = parseInt(document.getElementById("second_number").value)
            let result = num1 - num2;
            document.getElementById('result_id').value = result;

        }
             function multiply(){
            let num1 = parseInt(document.getElementById("first_number").value)
            let num2 = parseInt(document.getElementById("second_number").value)
            let result = num1 * num2;
            document.getElementById('result_id').value = result;

        }
             function division(){
            let num1 = parseInt(document.getElementById("first_number").value)
            let num2 = parseInt(document.getElementById("second_number").value)
            let result = num1 / num2;
            document.getElementById('result_id').value = result;

        }
             function modulus(){
            let num1 = parseInt(document.getElementById("first_number").value)
            let num2 = parseInt(document.getElementById("second_number").value)
            let result = num1 % num2;
            document.getElementById('result_id').value = result;

        }


    </script>

    <style>
        .button1{
            display: flex;
        }
    </style>
   



</head>
<body>
    <div>first number : <input type="text" name="" id="first_number"></div>
    <div>second number : <input type="text" name="" id="second_number"></div>
    <div class="button1">
          <div><button onclick="addition()">add</button></div>   
    <div><button onclick="multiply()">multiply</button></div>   
    <div><button onclick="substraction()">substraction</button></div>   
    <div><button onclick="division()">division</button></div>   
    <div><button onclick="modulus()">modulus</button></div>   
    </div>
  
    <div>result : <input type="text" name="" id="result_id"></div>
    
</body>




</html>
