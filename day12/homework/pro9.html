<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <script>

        function addition() {
            let num1 = parseInt(document.getElementById("first_number").value);
            let num2 = parseInt(document.getElementById("second_number").value);

            let result = num1 + num2;

            document.getElementById("result_id").value = result;
        }

        function subtract() {
            let num1 = parseInt(document.getElementById("first_number").value);
            let num2 = parseInt(document.getElementById("second_number").value);

            let result = num1 - num2;

            document.getElementById("result_id").value = result;
        }

          function multiply() {
            let num1 = parseInt(document.getElementById("first_number").value);
            let num2 = parseInt(document.getElementById("second_number").value);

            let result = num1 * num2;

            document.getElementById("result_id").value = result;
        }

               function devision() {
            let num1 = parseInt(document.getElementById("first_number").value);
            let num2 = parseInt(document.getElementById("second_number").value);

            let result = num1 / num2;

            document.getElementById("result_id").value = result;
        }

    </script>

</head>

<body>

    <div>
        First number :
        <input type="text" id="first_number">
    </div>

    <div>
        Second number :
        <input type="text" id="second_number">
    </div>

    <div>
        <button onclick="addition()">Addition</button>
        <button onclick="subtract()">Subtract</button>
        <button onclick="multiply()">multiply</button>
        <button onclick="devision()">devision</button>


    </div>

    <div>
        Result :
        <input type="text" id="result_id">
    </div>

</body>

</html>
