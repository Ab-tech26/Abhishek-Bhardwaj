<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beautiful Calculator</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .calculator {
            background: white;
            padding: 30px;
            border-radius: 20px;
            width: 350px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .calculator h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        .input-box {
            margin-bottom: 20px;
        }

        .input-box label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: bold;
        }

        .input-box input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            transition: 0.3s;
        }

        .input-box input:focus {
            border-color: #667eea;
            outline: none;
        }

        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .buttons button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            color: white;
        }

        .add-btn {
            background: #28a745;
        }

        .add-btn:hover {
            background: #218838;
            transform: scale(1.05);
        }

        .sub-btn {
            background: #dc3545;
        }

        .sub-btn:hover {
            background: #c82333;
            transform: scale(1.05);
        }

        .result-box {
            margin-top: 25px;
        }

        .result-box input {
            background: #f4f4f4;
            font-weight: bold;
            color: #333;
        }
    </style>

    <script>

        function addition() {
            let num1 = parseInt(document.getElementById("first_number").value);
            let num2 = parseInt(document.getElementById("second_number").value);

            let result = num1 + num2;

            document.getElementById("result_id").value = result;
        }

        function subtract() {
            let num1 = parseInt(document.getElementById("first_number").value);
            let num2 = parseInt(document.getElementById("second_number").value);

            let result = num1 - num2;

            document.getElementById("result_id").value = result;
        }

    </script>

</head>

<body>

    <div class="calculator">

        <h1>Simple Calculator</h1>

        <div class="input-box">
            <label>First Number</label>
            <input type="number" id="first_number">
        </div>

        <div class="input-box">
            <label>Second Number</label>
            <input type="number" id="second_number">
        </div>

        <div class="buttons">
            <button class="add-btn" onclick="addition()">Addition</button>

            <button class="sub-btn" onclick="subtract()">Subtract</button>
        </div>

        <div class="input-box result-box">
            <label>Result</label>
            <input type="text" id="result_id" readonly>
        </div>

    </div>

</body>

</html>
