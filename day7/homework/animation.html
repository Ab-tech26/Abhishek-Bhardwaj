<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .box1 {
            height: 200px;
            width: 200px;
            background-color: red;
            border: 2px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            left: 200px;
            top: 200px;
        }

        .flip-scale-2-hor-bottom {
            animation: flip-scale-2-hor-bottom .5s linear both
        }

        @keyframes flip-scale-2-hor-bottom {
            0% {
                transform: translateY(0) rotateX(0) scale(1);
                transform-origin: 50% 100%
            }

            50% {
                transform: translateY(50%) rotateX(90deg) scale(2);
                transform-origin: 50% 50%
            }

            100% {
                transform: translateY(100%) rotateX(180deg) scale(1);
                transform-origin: 50% 0
            }
        }
    </style>

</head>

<body>

    <div class="box1 flip-scale-2-hor-bottom"> Hello </div>



</body>

</html>
