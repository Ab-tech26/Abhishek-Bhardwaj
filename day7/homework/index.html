    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }



        .box1 {
            width: 400px;
            height: 400px;
            background-color: aqua;
            border: 2px solid black;
            border-radius: 10px;
            position: absolute;
            top: 100px;
            left: 100px;
            /* width: 100vw; */
            /* height: 100px; */
            /* overflow-y: scroll; */
            z-index: 1;


        }

        .box2 {
            width: 400px;
            height: 400px;
            background-color: rgb(206, 82, 167);
            border: 2px solid black;
            border-radius: 10px;
            position: absolute;
            top: 220px;
            left: 220px;
            z-index: 2;


        }

        .box3 {
            width: 400px;
            height: 400px;
            background-color: rgb(243, 35, 35);
            border: 2px solid black;
            border-radius: 10px;
            position: absolute;
            top: 440px;
            left: 440px;
            z-index: 3;
        }

        .box1:hover,
        .box2:hover,
        .box3:hover {
            transform: scale(1.2);
            transition: 2s;
        }

        .rotate-center {
            animation: rotate-center 4s ease-in-out both infinite
        }

        @keyframes rotate-center {
            0% {
                transform: rotate(0)
            }

            100% {
                transform: rotate(360deg)
            }
        }
    </style>




</head>

<body>

        <h1>Sub assy</h1>
