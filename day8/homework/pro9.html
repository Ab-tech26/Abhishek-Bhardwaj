<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
            background-color: aqua;
        }
    </style>
</head>

<body>

    <script>
        let age = parseInt(prompt("Enter your age"));

        if (age > 17) {
            document.write("You can fill the form");
        } 
        else if (age == 17) {
            document.write("You are 17 years old");
        } 
        else {
            document.write("You are not eligible");
        }
    </script>

</body>

</html>
