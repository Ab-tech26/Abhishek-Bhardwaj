<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let result = 1
        let number = parseInt(prompt("Enter the number"))
        for (let i = number; i >= 1; i--) {
            result = result * i
             
        }
            document.write(result)
      
    </script>


</body>

</html>
