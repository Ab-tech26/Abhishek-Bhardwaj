<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <script>
        function power(base, pw) {
            let result = 1
            for (let count = 1; count <= pw; count++) {

                result = result * base;
            }
            return result;
        }
        document.write(power(2,5));

    </script>



</body>
